[Service]
ExecStart=
ExecStart=/usr/bin/flock -w 1800 /home/ken-wang/AI-Video-Transcriber/temp/maintenance.lock /home/ken-wang/.local/bin/uv run --locked python cli.py --watch
UMask=0077
Environment=PYTHONUNBUFFERED=1
MemoryAccounting=yes
CPUAccounting=yes
IOAccounting=yes
MemoryHigh=2G
MemoryMax=4G
MemorySwapMax=256M
# systemd 257 groups OOM termination through this native policy.
OOMPolicy=kill
CPUQuota=200%
Nice=10
IOWeight=25
# Root filesystem is /dev/sda1 on this host; throttle its whole disk.
# Exact bytes per second: 80 MiB read / 40 MiB write.
IOReadBandwidthMax=/dev/sda 83886080
IOWriteBandwidthMax=/dev/sda 41943040
